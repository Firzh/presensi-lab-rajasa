server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    # Optimasi 1: Izinkan upload file hingga 100MB (untuk foto presensi)
    client_max_body_size 10M;

    # Optimasi 2: Gunakan charset UTF-8 agar karakter spesial muncul benar
    charset utf-8;

    root /var/www/public;

    # Blok untuk API / Backend (PHP)
    location ^~ /api/ {
        include fastcgi_params;

        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_read_timeout 300;
    }

    # Cegah akses langsung ke file PHP
    location ~ \.php$ {
        return 404;
    }

    # Blok untuk Frontend (Vite Reverse Proxy)
    # Ini memungkinkan kamu mengakses Frontend via http://localhost:8080
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        # Optimasi 4: Header untuk mendukung Vite HMR (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimasi 5: Sembunyikan file sensitif seperti .env atau .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}