services:
  db:
    image: mariadb:11.4
    container_name: presensi_lab_db_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./docker/mariadb/my.prod.cnf:/etc/mysql/conf.d/99-my.prod.cnf:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: presensi_lab_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage_prod:/var/www/storage
    networks:
      - prod-network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile.prod
    container_name: presensi_lab_nginx_prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  db_data_prod:
  backend_storage_prod:
