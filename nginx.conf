server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    # Optimasi 1: Izinkan upload file hingga 100MB (untuk foto presensi)
    client_max_body_size 100M;

    # Optimasi 2: Gunakan charset UTF-8 agar karakter spesial muncul benar
    charset utf-8;

    root /var/www/public;

    # Blok untuk API / Backend (PHP)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000; 
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Optimasi 3: Tambahkan timeout agar tidak gampang '504 Gateway Timeout' 
        # saat debugging kode yang berat
        fastcgi_read_timeout 300;
    }

    # Blok untuk Frontend (Vite Reverse Proxy)
    # Ini memungkinkan kamu mengakses Frontend via http://localhost:8080
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        # Optimasi 4: Header untuk mendukung Vite HMR (WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fallback ke index.php jika file statis tidak ditemukan (untuk routing Laravel)
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Optimasi 5: Sembunyikan file sensitif seperti .env atau .git
    location ~ /\.(?!well-known).* {
        deny all;
    }
}